[package]
name = "trim-tauri"
version = "0.1.3"
description = "Trim"
authors = ["xiaoxu"]
edition = "2021"
rust-version = "1.98"

# Phase 0 Spike：lib + bin 双目标。
# - bin：桌面应用入口（windows_subsystem 在 main.rs 设置）
# - lib：供 tests/ 集成测试链接（D6 验收三件套第 2 条，DPAPI 兼容性等）
[lib]
name = "trim_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset：E 批 P1 项——启用 asset 协议让背景图与导入字体可被页面加载
# （Tauri 页源 http://tauri.localhost 跨不到 file: 子资源）。
# 实测：只改 tauri.conf.json 的 assetProtocol.enable 不够，构建脚本会因
# 「features 与 conf allowlist 不符」直接失败，必须同时在这里开这个 feature。
tauri = { version = "2", features = ["protocol-asset"] }
# 原生引擎（扫描/清理 + 性能指标）：Phase 1 已 lib 化（加 [lib] trim_finder，CLI 入口保留）。
# 直调替代 spawn finder.exe：高频轮询类命令（ov-metrics ~2.5s 一拍、net-sample 每秒一帧）
# 不再付进程创建成本。
#
# **已 vendor 进本仓库**（../native-scanner），不再是 `../../Trim/native-scanner`。
# 原因：仓库外的相对路径让干净 clone 根本拿不到它，cargo 直接 os error 3 断构建
# —— 即方案登记的 R24。2026-09-24 用「克隆到别处 vs 克隆到 Trim 旁」两组实跑坐实为真缺陷。
#
# 为什么不并成 workspace 成员：cargo 在合并工作区里只认根节点的 [profile.*]，
# 而 native-scanner 自带 opt-level=3 / lto=true / codegen-units=1，并进来会被静默降级
# —— 那几个参数直接决定扫描性能。故让它独立成包、仅作 path 依赖。
#
# ⚠️ 双份维护：这份副本与 `C:\KaiFa\Trim\native-scanner`（Electron 轨）从此各自演化，
# 改扫描器要说清改的是哪一份。Phase 5 清理双轨时 Electron 侧那份随 Electron 退役。
trim-finder = { path = "../native-scanner" }
# 原生文件对话框（log:export 保存 / paths:browse 选目录）——官方插件，仅用 Rust 侧 API，
# 不向渲染层暴露 JS 命令面（少一个权限面）
tauri-plugin-dialog = "2"
# E 批 elevate：单实例锁 + second-instance argv 语义（方案 S8 / §176）。
# 上游 Electron 用 app.requestSingleInstanceLock()，且提权握手依赖 second-instance 事件，
# Tauri 侧对应件即此官方插件。
tauri-plugin-single-instance = "2"
# E 批 updater：自动更新（方案 Phase 4 第 5 条 + 用户 2026-09-24 拍板走断代路线）。
# 信任模型与上游同构：sha512/签名不得由下载通道自己提供，必须由**应用内置公钥**背书；
# 差别只在算法从 ed25519(latest.yml.sig) 换成 minisign(latest.json 内联 signature)。
tauri-plugin-updater = "2"
# updater 的 endpoints 参数类型是 url::Url，必须直接引；该 crate 本就在依赖树内
# （tauri / reqwest 传递依赖，实测解析为 2.5.8），提为直接依赖不增加任何编译成本。
url = "2"
# D4 液态玻璃材质映射：mica / tabbed(mica-alt) / acrylic
# 官方 tauri-apps 维护（仓库名 tauri-plugin-vibrancy，Rust crate 名 window-vibrancy）
window-vibrancy = "0.8"
serde = { version = "1", features = ["derive"] }
# preserve_order：C 批规则库验签必需——JS 的 canonicalBodyText 是
# `JSON.stringify({...parsed, _sig: undefined})`，键序 = 原文件解析插入序；
# 默认 BTreeMap 会重排键，导致同一份规则文件在 JS 下验签通过、Rust 下失败。
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
# D5：Chromium OSCrypt v10 = AES-256-GCM（Phase 0 第 6 项实测，见 safestorage.rs）
aes-gcm = "0.10"
# paths:app-icon / paths:file-icon：Shell 图标 → PNG dataURL
# （Electron app.getFileIcon 返回 NativeImage.toDataURL()，即 PNG；保持格式一致）
png = "0.17"
# C 批 cleanup：规则库 ed25519 验签（Electron 侧 crypto.verify(null, body, PEM, sig)）。
# 只取 dalek 的「验签」能力（verify_strict），不启用签名侧特性。
ed25519-dalek = "2"
# C 批 runtimes：安装包 SHA-256 + 尺寸双校验（闸门 2，见 main.js downloadRedist）
sha2 = "0.10"

# 测试专用：tauri::test（MockRuntime）无窗口 IPC 集成测试（D6 验收三件套第 2 条）。
# 只在此处打开 `test` 特性——[dependencies] 里的 tauri 不带它，生产构建不含测试代码。
[dev-dependencies]
tauri = { version = "2", features = ["test"] }

# Windows 原生 API：
# - Dwm：DWM 圆角（forceRoundCorners 等价）、SystemBackdrop 兜底
# - SystemInformation：RtlGetVersion 取真实内部版本号（getWindowsBuild/getFluentSupportLevel 等价）
# - UI::Shell：IsUserAnAdmin（elevate:status 等价物，Phase 0 仅信息展示）
# - Security::Cryptography + System::Memory：DPAPI 兼容读（D5，dpapi:v1: 解密）
[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_SystemInformation",
    "Win32_System_Time",
    "Win32_Security_Cryptography",
    # Shell 图标提取（SHGetFileInfoW 需要 Storage_FileSystem + WindowsAndMessaging 门控）
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    # C 批 HTTP：runtimes 下载安装包、aidesc/models POST JSON 一律走 Windows 原生
    # WinHTTP（仅新增特性，不新增第三方 HTTP crate；Electron 侧分别是主进程 fetch/下载）
    "Win32_Networking_WinHttp",
    # E 批 appearance：GetSystemPowerStatus 判电池供电（亚克力系材质省电降级）
    "Win32_System_Power",
    # 审查 M6：pwsh 子进程树关进 Job Object（CreateJobObjectW / AssignProcessToJobObject
    # / JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE）；EXTENDED_LIMIT 结构含 IO_COUNTERS，
    # 故连 Win32_System_Threading 一起开；CreateJobObjectW 的签名引用 SECURITY_ATTRIBUTES。
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Security",
    # windows 0.61 把 RtlGetVersion 划到 Wdk 命名空间
    "Wdk_System_SystemServices",
]

[profile.dev]
# Spike 调试期增量优化，保持默认；不动 release 配置（产物新鲜度门禁见方案 Phase 4 第 6 条）
incremental = true
