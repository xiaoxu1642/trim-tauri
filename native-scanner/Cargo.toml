[package]
name = "trim-finder"
version = "1.0.0"
edition = "2021"
description = "Trim 内建原生扫描器（重复/大文件/空文件/AppData/大小统计）"

[dependencies]
blake3 = "1.8"
rayon = "1.11"
# v3.7.1 R1/R2/R3：Windows 原生 API（feature 最小集，方案 §4）
# 注：miniz_oxide 原为文档相似检测的 zip 解压依赖，该检测 2026-09-28 移除后一并删除
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Security",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
] }

[lib]
name = "trim_finder"
path = "src/lib.rs"

[[bin]]
name = "finder"
path = "src/main.rs"

# ⚠️ 作用域提醒（2026-10-14 现算澄清，别再当成产品链路的保险）：Cargo 的 profile 只取
# 「被构建的那个 workspace root」的 manifest。这一段**只在本目录内独立构建时生效**
# （例如 `cd native-scanner && cargo build --release` 出 finder.exe、或跑它的 #[ignore] 探针）；
# 被 src-tauri 作为 path 依赖参与构建时，它和所有「依赖的 profile 段」一样被忽略，
# 那时决定优化面的是 `src-tauri/Cargo.toml` 末尾的 `[profile.release]`。
# 因此这一段**不许删**（删了独立构建会掉到默认值），但也别指望它在安装包链路里起作用。
[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
